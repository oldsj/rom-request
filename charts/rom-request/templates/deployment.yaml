{{- $ca := include "app.dbCASecret" . }}
{{- $secret := include "app.secretName" . }}
{{- $int := .Values.integrations }}
{{- $storage := .Values.storage }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        runAsGroup: {{ .Values.podSecurity.runAsGroup }}
        {{- with .Values.podSecurity.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.podSecurity.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.spread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.spread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.spread.whenUnsatisfiable }}
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
          # Count only this rollout's pods, so a rolling update isn't blocked by the old ones.
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
      containers:
        - name: app
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ALLOW_SIGNUP
              value: {{ .Values.config.allowSignup | quote }}
            - name: SESSION_TTL
              value: {{ .Values.config.sessionTTL | quote }}
            - name: PASSWORD_LOGIN
              value: {{ .Values.auth.passwordLogin | quote }}
            {{- with .Values.auth.oidc }}
            {{- if .issuer }}
            - name: OIDC_ISSUER
              value: {{ .issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required with auth.oidc.issuer" .clientId | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ printf "https://%s/api/auth/oidc/callback" (required "auth.oidc.issuer needs route.hostname, for the callback URL" $.Values.route.hostname) | quote }}
            - name: OIDC_NAME
              value: {{ .name | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            {{- with .allowedGroups }}
            - name: OIDC_ALLOWED_GROUPS
              value: {{ . | quote }}
            {{- end }}
            {{- with .limitedGroups }}
            - name: OIDC_LIMITED_GROUPS
              value: {{ . | quote }}
            {{- end }}
            {{- else if not $.Values.auth.passwordLogin }}
            {{- fail "auth.passwordLogin=false needs auth.oidc.issuer" }}
            {{- end }}
            {{- end }}
            - name: AUTH_RATE_PER_MINUTE
              value: {{ .Values.config.authRatePerMinute | quote }}
            {{- with .Values.config.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.dbSecret" . | quote }}
                  key: {{ .Values.database.urlKey | quote }}
            {{- if $ca }}
            # pgx reads these libpq variables: TLS, with the server's certificate and name checked.
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/db-ca/ca.crt
            {{- end }}
            {{- with $int.prowlarr.url }}
            - name: PROWLARR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $int.prowlarr.categories }}
            - name: PROWLARR_CATEGORIES
              value: {{ . | quote }}
            {{- end }}
            {{- if $int.prowlarr.url }}
            - name: PROWLARR_BLOCKED_INDEXERS
              value: {{ $int.prowlarr.blockedIndexers | default "" | quote }}
            {{- end }}
            {{- with ($int.romm).url }}
            - name: ROMM_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $int.qbittorrent.url }}
            {{- if not (and $storage.downloads $storage.library) }}
            {{- fail "integrations.qbittorrent.url needs storage.downloads and storage.library" }}
            {{- end }}
            - name: QBITTORRENT_URL
              value: {{ . | quote }}
            - name: QBITTORRENT_SAVE_PATH
              value: {{ required "integrations.qbittorrent.savePath is required with its url" $int.qbittorrent.savePath | quote }}
            {{- end }}
            {{- with $int.qbittorrent.category }}
            - name: QBITTORRENT_CATEGORY
              value: {{ . | quote }}
            {{- end }}
            {{- if $storage.downloads }}
            - name: DOWNLOAD_DIR
              value: /data/downloads
            {{- end }}
            {{- if $storage.library }}
            - name: LIBRARY_DIR
              value: /data/library
            {{- end }}
            - name: LIBRARY_EXCLUDE
              value: {{ $int.libraryExclude | quote }}
            - name: WORKER_INTERVAL
              value: {{ $int.workerInterval | quote }}
            {{- with $int.catalog.platforms }}
            - name: CATALOG_PLATFORMS
              value: {{ . | quote }}
            {{- end }}
            {{- range .Values.secrets.env }}
            - name: {{ .name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.existingSecret is required with secrets.env" $secret | quote }}
                  key: {{ .key | quote }}
                  {{- if .optional }}
                  optional: true
                  {{- end }}
            {{- end }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $ca $storage.downloads $storage.library }}
          volumeMounts:
            {{- if $ca }}
            - name: db-ca
              mountPath: /etc/db-ca
              readOnly: true
            {{- end }}
            {{- if $storage.downloads }}
            - name: downloads
              mountPath: /data/downloads
              readOnly: true
            {{- end }}
            {{- if $storage.library }}
            - name: library
              mountPath: /data/library
            {{- end }}
          {{- end }}
      {{- if or $ca $storage.downloads $storage.library }}
      volumes:
        {{- if $ca }}
        - name: db-ca
          secret:
            secretName: {{ $ca | quote }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- with $storage.downloads }}
        - name: downloads
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $storage.library }}
        - name: library
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
