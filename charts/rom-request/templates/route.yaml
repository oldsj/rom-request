{{- if .Values.route.enabled }}
{{- $name := include "app.fullname" . }}
{{- $host := required "route.hostname is required when route.enabled" .Values.route.hostname }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.route.clusterIssuer | quote }}
  dnsNames:
    - {{ $host | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ required "route.gateway.name is required when route.enabled" .Values.route.gateway.name | quote }}
    namespace: {{ required "route.gateway.namespace is required when route.enabled" .Values.route.gateway.namespace | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $name }}-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $name }}
      sectionName: https
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 80
{{- end }}
