{{- if .Values.route.enabled }}
{{- $name := include "app.fullname" . }}
{{- $host := required "route.hostname is required when route.enabled" .Values.route.hostname }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.route.clusterIssuer | quote }}
  dnsNames:
    - {{ $host | quote }}
{{- /* The ListenerSet on route.gateway keeps the app's own name; each of route.extraGateways
gets <name>-<gateway name>. The one HTTPRoute attaches to all of them. */}}
{{- $listenerSets := list (dict "name" $name "gateway" .Values.route.gateway) }}
{{- range .Values.route.extraGateways }}
{{- $gw := required "route.extraGateways[].name is required" .name }}
{{- $listenerSets = append $listenerSets (dict "name" (printf "%s-%s" $name $gw) "gateway" .) }}
{{- end }}
{{- range $listenerSets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ required "route.gateway.name is required when route.enabled" .gateway.name | quote }}
    namespace: {{ required "route.gateway.namespace is required when route.enabled" .gateway.namespace | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $name }}-tls
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range $listenerSets }}
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ .name }}
      sectionName: https
    {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 80
{{- end }}
