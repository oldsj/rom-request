# Development and test database. `make dev` and `make test` start it; data is thrown away with
# `docker compose down -v`.
services:
  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-dev-only
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-54329}:5432
    tmpfs:
      - /var/lib/postgresql:rw,size=1g
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U app -d app]
      interval: 2s
      timeout: 3s
      retries: 30
